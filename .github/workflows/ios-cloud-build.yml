name: iOS Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

jobs:
  build:
    name: Build MP3 Build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests on simulator
        run: |
          set +e
          mkdir -p build
          xcodebuild test \
            -project MP3Build.xcodeproj \
            -scheme MP3Build \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            -resultBundlePath build/TestResults.xcresult 2>&1 | tee build/xcode-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild test failed with exit code $status"
            grep -i -E "error:|cannot |failed|SettingsView|SwiftCompile|CompileSwift" build/xcode-test.log | tail -160 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project MP3Build.xcodeproj \
            -scheme MP3Build \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/MP3Build.app build/Payload/
          cd build
          zip -qry MP3Build-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MP3Build-unsigned-ipa
          path: build/MP3Build-unsigned.ipa

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MP3Build-test-results
          path: |
            build/TestResults.xcresult
            build/xcode-test.log
